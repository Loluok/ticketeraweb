<!DOCTYPE html>
<html>

<head>
    <title>Crear Ticket</title>
</head>

<body>

<h1>Nuevo Ticket</h1>

<form method="POST">

    <label>Título:</label>
    <br>
    <input type="text" name="titulo">

    <br><br>

    <label>Descripción:</label>
    <br>
    <textarea name="descripcion"></textarea>

    <br><br>

    <label>Prioridad:</label>

    <select name="prioridad">
        <option>Baja</option>
        <option>Media</option>
        <option>Alta</option>
    </select>

    <br><br>

    <button type="submit">
        Crear Ticket
    </button>

</form>

</body>

</html>
